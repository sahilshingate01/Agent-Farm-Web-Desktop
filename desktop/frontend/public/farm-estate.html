<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>claude-farm · estate plan</title>
<style>
html,body{margin:0;height:100%;background:#0c1210;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
#app{position:absolute;inset:0;}
#hud{position:absolute;top:18px;left:22px;color:#a7b4a0;font-size:13px;line-height:1.6;pointer-events:none;z-index:2;}
#hud small{font-size:11px;color:#6d7a68;}
#live{position:absolute;top:22px;right:24px;color:#8fae6c;font-size:11px;pointer-events:none;z-index:2;}
#live b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8fae6c;margin-right:6px;animation:blink 2s infinite;}
@keyframes blink{50%{opacity:0.2;}}
#legend{position:absolute;bottom:16px;left:22px;color:#6d7a68;font-size:11px;pointer-events:none;z-index:2;}
#legend span{margin-right:14px;}
#ctl,#sim{position:absolute;bottom:16px;right:22px;z-index:3;background:rgba(16,24,19,0.85);border:1px solid #26332a;border-radius:8px;padding:10px 14px;color:#a7b4a0;font-size:11px;user-select:none;}
#sim{bottom:142px;}
#ctl .row,#sim .row{display:flex;align-items:center;gap:8px;margin:6px 0;}
#ctl .row>span:first-child,#sim .row>span:first-child{width:78px;color:#6d7a68;}
#ctl button,#sim button{font:inherit;color:#a7b4a0;background:transparent;border:1px solid #3a4a3a;border-radius:4px;padding:2px 9px;cursor:pointer;}
#ctl button.on{color:#e8b464;border-color:#e8b464;}
#ctl input[type=checkbox]{accent-color:#8fae6c;margin:0;cursor:pointer;}
#ctl label{display:flex;align-items:center;gap:8px;cursor:pointer;}
#tip{display:none;position:absolute;z-index:8;background:rgba(16,24,19,0.92);border:1px solid #3a4a3a;border-radius:6px;padding:5px 9px;font-size:11px;pointer-events:none;color:#a7b4a0;}
#card{display:none;position:absolute;top:70px;right:22px;z-index:8;width:268px;max-height:70vh;overflow-y:auto;background:rgba(16,24,19,0.94);border:1px solid #3a4a3a;border-radius:8px;padding:12px 14px;color:#a7b4a0;font-size:12px;}
#card h4{margin:0 18px 4px 0;font-size:13px;font-weight:500;color:#e8dcc6;}
#card .path{color:#6d7a68;font-size:11px;word-break:break-all;margin-bottom:8px;}
#card .meta{font-size:11px;margin-bottom:10px;}
#card button{font:inherit;font-size:11px;color:#a7b4a0;background:transparent;border:1px solid #3a4a3a;border-radius:4px;padding:3px 9px;cursor:pointer;margin-right:6px;}
#card .hint{color:#6d7a68;font-size:10px;margin-top:8px;min-height:12px;}
#cardclose{position:absolute;top:6px;right:8px;border:none !important;color:#6d7a68;}
#err{display:none;position:absolute;inset:auto 22px 22px 22px;background:#1a0f0f;border:1px solid #6b2b2b;border-radius:8px;padding:12px 16px;color:#f0a0a0;font-size:12px;white-space:pre-wrap;z-index:9;}
canvas{display:block;}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">claude-farm · estate plan<br><small>drag to orbit · scroll to zoom</small></div>
<div id="live"><b></b>live</div>
<div id="legend">
<span style="color:#8fae6c;">·····</span><span>harvest flow</span>
<span style="color:#e8b464;">·····</span><span>rota route</span>
<span style="color:#7f9bd8;">·····</span><span>workflow tracks</span>
<span style="color:#8fae6c;">▮</span><span>silo fill = quota used</span>
</div>
<div id="sim">
<div class="row"><span>session</span><input type="range" id="sess" min="0" max="100" value="18" style="width:112px;accent-color:#e8b464;"></div>
<div class="row"><button id="bmsg">message</button><button id="bconv">+ convo</button><button id="bconvx">&minus; convo</button></div>
<div class="row"><button id="bnotif">notify</button><button id="bscatter">dismiss</button><button id="bbell">alert</button></div>
<div class="row"><button id="btend">tend worst field</button></div>
<div class="row"><span id="simstat" style="width:auto;color:#6d7a68;"></span></div>
</div>
<div id="ctl">
<div class="row"><span>line weight</span><button data-w="0" class="on">1</button><button data-w="1">2</button><button data-w="2">3</button></div>
<div class="row"><span>scanlines</span><label><input type="checkbox" id="cscan"><span>sweep down</span></label></div>
<div class="row"><span>crt</span><label><input type="checkbox" id="ccrt"><span>warp + vignette</span></label></div>
</div>
<div id="tip"></div>
<div id="card">
<button id="cardclose">&times;</button>
<h4 id="cardtitle"></h4>
<div class="path" id="cardpath"></div>
<div class="meta" id="cardmeta"></div>
<div id="cardbody"></div>
<div id="cardbtns"><button id="cardopen">open in wiki</button><button id="cardtend">tend field</button></div>
<div class="hint" id="cardhint"></div>
</div>
<div id="err"></div>
<script src="three-r128.min.js"></script>
<script>
(function(){
"use strict";
var errBox=document.getElementById('err');
function fail(msg){errBox.style.display='block';errBox.textContent=msg;}
window.addEventListener('error',function(e){
  fail('Runtime error: '+e.message+'\n'+(e.filename||'')+' line '+(e.lineno||'?')+(e.error&&e.error.stack?'\n\n'+e.error.stack:''));
});

function start(){
try{
  if(typeof THREE==='undefined'){fail('three.js failed to load from CDN. Check network access and reload.');return;}
  var probe=document.createElement('canvas');
  var gl=probe.getContext('webgl')||probe.getContext('experimental-webgl');
  if(!gl){fail('WebGL is not available in this viewer. Open this file in a normal browser tab (Chrome, Safari, Firefox) to see the 3D scene.');return;}

  var app=document.getElementById('app');
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setClearColor(0x0c1210);
  app.appendChild(renderer.domElement);

  var rt=new THREE.WebGLRenderTarget(2,2,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  var postScene=new THREE.Scene();
  var postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  var postU={
    tDiffuse:{value:rt.texture},
    res:{value:new THREE.Vector2(2,2)},
    uThick:{value:0},
    uScan:{value:0},
    uWarp:{value:0},
    uTime:{value:0}
  };
  var postMat=new THREE.ShaderMaterial({
    uniforms:postU,
    vertexShader:[
      'varying vec2 vUv;',
      'void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}'
    ].join('\n'),
    fragmentShader:[
      'precision highp float;',
      'uniform sampler2D tDiffuse;',
      'uniform vec2 res;',
      'uniform float uThick;',
      'uniform float uScan;',
      'uniform float uWarp;',
      'uniform float uTime;',
      'varying vec2 vUv;',
      'void main(){',
      '  vec2 uv=vUv;',
      '  if(uWarp>0.5){',
      '    vec2 c=uv*2.0-1.0;',
      '    float r2=dot(c,c);',
      '    c*=1.0+0.10*r2+0.06*r2*r2;',
      '    c*=0.87;',
      '    uv=c*0.5+0.5;',
      '  }',
      '  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0){',
      '    gl_FragColor=vec4(0.012,0.028,0.022,1.0);return;',
      '  }',
      '  vec2 px=1.0/res;',
      '  vec3 col=texture2D(tDiffuse,uv).rgb;',
      '  if(uThick>0.5){',
      '    for(int i=-2;i<=2;i++){',
      '      for(int j=-2;j<=2;j++){',
      '        vec2 o=vec2(float(i),float(j));',
      '        if(max(abs(o.x),abs(o.y))<=uThick){',
      '          col=max(col,texture2D(tDiffuse,uv+o*px).rgb);',
      '        }',
      '      }',
      '    }',
      '  }',
      '  if(uScan>0.5){',
      '    col*=0.82+0.18*sin(uv.y*res.y*3.14159);',
      '    float band=exp(-pow((fract(uv.y+uTime*0.06)-0.5)*7.0,2.0));',
      '    col+=col*band*0.45;',
      '  }',
      '  if(uWarp>0.5){',
      '    float d=length(vUv-0.5);',
      '    col*=1.0-0.55*pow(d*1.55,2.2);',
      '    col.g*=1.04;',
      '    col.b*=0.97;',
      '  }',
      '  gl_FragColor=vec4(col,1.0);',
      '}'
    ].join('\n')
  });
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));

  var scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x0c1210,450,900);
  var camera=new THREE.PerspectiveCamera(45,1,1,2500);
  var C={wire:0x7d8f74,dim:0x55654f,amber:0xe8b464,green:0x8fae6c,blue:0x7f9bd8,text:'#a7b4a0',muted:'#6d7a68'};

  function lm(c,o){return new THREE.LineBasicMaterial({color:c,transparent:true,opacity:(o===undefined?1:o)});}
  function vecs(pts){
    var out=[];
    for(var i=0;i<pts.length;i++){out.push(new THREE.Vector3(pts[i][0],pts[i][1],pts[i][2]));}
    return out;
  }
  function seg(pts,c,o){
    var g=new THREE.BufferGeometry().setFromPoints(vecs(pts));
    return new THREE.LineSegments(g,lm(c,o));
  }
  function polyline(v3s,c,o){
    var g=new THREE.BufferGeometry().setFromPoints(v3s);
    return new THREE.Line(g,lm(c,o));
  }
  function circleV(r,y,n){
    var p=[];
    for(var i=0;i<=n;i++){var a=i/n*Math.PI*2;p.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));}
    return p;
  }
  function loop(r,y,c,o){return polyline(circleV(r,y,40),c,o);}
  function ebox(w,h,d,c,o){
    return new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),lm(c,o));
  }
  function gable(w,h,d,peak,c,o){
    return seg([[-w/2,h,-d/2],[0,h+peak,-d/2],[0,h+peak,-d/2],[w/2,h,-d/2],
                [-w/2,h,d/2],[0,h+peak,d/2],[0,h+peak,d/2],[w/2,h,d/2],
                [0,h+peak,-d/2],[0,h+peak,d/2]],c,o);
  }
  function label(str,color,size){
    var cnv=document.createElement('canvas');cnv.width=512;cnv.height=96;
    var ctx=cnv.getContext('2d');
    if(!ctx)return new THREE.Group();
    ctx.font='500 40px ui-monospace,Menlo,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;
    ctx.fillText(str,256,48);
    var tex=new THREE.CanvasTexture(cnv);
    tex.minFilter=THREE.LinearFilter;
    var spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
    spr.scale.set(size,size*0.1875,1);
    return spr;
  }
  function tag(g,t1,t2,y){
    var a=label(t1,C.text,58);a.position.y=y;g.add(a);
    if(t2){var b=label(t2,C.muted,64);b.position.y=y-8;g.add(b);}
  }

  var ground=[];
  for(var gi=-280;gi<=280;gi+=20){
    ground.push([gi,0,-280],[gi,0,280],[-280,0,gi],[280,0,gi]);
  }
  var groundLines=seg(ground,0x2a382c,0.35);
  scene.add(groundLines);

  var silosReg={};
  function makeSiloFill(reg,frac){
    if(reg.fillMesh){reg.g.remove(reg.fillMesh);reg.fillMesh.geometry.dispose();reg.fillMesh.material.dispose();reg.fillMesh=null;}
    if(reg.fillLoop){reg.g.remove(reg.fillLoop);reg.fillLoop.geometry.dispose();reg.fillLoop.material.dispose();reg.fillLoop=null;}
    if(frac>0.005&&!reg.empty){
      var deck=reg.padH||0;
      var towerH=Math.max(reg.h-deck,4);
      var fh=towerH*frac,fc=reg.active?C.amber:C.green;
      reg.fillMesh=new THREE.Mesh(new THREE.CylinderGeometry(reg.r*0.92,reg.r*0.92,fh,24),
        new THREE.MeshBasicMaterial({color:fc,transparent:true,opacity:0.14,depthWrite:false}));
      reg.fillMesh.position.y=deck+fh/2;reg.g.add(reg.fillMesh);
      reg.fillLoop=loop(reg.r*0.94,deck+fh,fc,0.85);
      reg.g.add(reg.fillLoop);
    }
  }
  /** Silo pad: low rectangular platform (no lollipop beacons). Occupied pads
   *  carry a short tower; empty pads stay available around the ring. */
  function siloPad(x,z,frac,active,name,empty){
    var g=new THREE.Group();g.position.set(x,0,z);
    // Face the elevator so the ring reads as a clean outer apron.
    g.rotation.y=Math.atan2(x-0,-(z-(-20)));
    var pw=18,pd=14,ph=1.2;
    var col=empty?C.dim:(active?C.amber:C.wire);
    var mats=[];
    function put(o){if(o.material)mats.push(o.material);g.add(o);}
    // Pad slab + outline
    put(ebox(pw,ph,pd,col,empty?0.45:0.85));
    var pad=g.children[g.children.length-1];
    pad.position.y=ph/2;
    put(seg([
      [-pw/2,ph+0.05,-pd/2],[pw/2,ph+0.05,-pd/2],
      [pw/2,ph+0.05,-pd/2],[pw/2,ph+0.05,pd/2],
      [pw/2,ph+0.05,pd/2],[-pw/2,ph+0.05,pd/2],
      [-pw/2,ph+0.05,pd/2],[-pw/2,ph+0.05,-pd/2]
    ],col,empty?0.4:0.75));
    var h=empty?8:28;
    var r=Math.min(pw,pd)*0.28;
    if(!empty){
      // Short tower on the pad — no sphere beacon / lollipop.
      put(loop(r,ph+0.2,col,0.85));
      put(loop(r,ph+h,col,0.85));
      put(loop(r,ph+h*0.5,col,0.3));
      var vp=[];
      for(var i=0;i<6;i++){
        var a=i/6*Math.PI*2,px=Math.cos(a)*r,pz=Math.sin(a)*r;
        vp.push([px,ph,pz],[px,ph+h,pz]);
      }
      put(seg(vp,col,0.5));
      // Flat cap (not a peaked roof with a ball)
      put(seg([
        [-r,ph+h,-r],[r,ph+h,-r],[r,ph+h,-r],[r,ph+h,r],
        [r,ph+h,r],[-r,ph+h,r],[-r,ph+h,r],[-r,ph+h,-r]
      ],col,0.7));
    }else{
      // Empty pad: corner ticks only
      var tick=2.2;
      put(seg([
        [-pw/2,ph+0.1,-pd/2],[-pw/2+tick,ph+0.1,-pd/2],
        [-pw/2,ph+0.1,-pd/2],[-pw/2,ph+0.1,-pd/2+tick],
        [pw/2,ph+0.1,-pd/2],[pw/2-tick,ph+0.1,-pd/2],
        [pw/2,ph+0.1,-pd/2],[pw/2,ph+0.1,-pd/2+tick],
        [-pw/2,ph+0.1,pd/2],[-pw/2+tick,ph+0.1,pd/2],
        [-pw/2,ph+0.1,pd/2],[-pw/2,ph+0.1,pd/2-tick],
        [pw/2,ph+0.1,pd/2],[pw/2-tick,ph+0.1,pd/2],
        [pw/2,ph+0.1,pd/2],[pw/2,ph+0.1,pd/2-tick]
      ],col,0.35));
    }
    var reg={g:g,r:r,h:ph+h,padH:ph,active:!!active,fillMesh:null,fillLoop:null,mats:mats,label:null,empty:!!empty};
    if(!empty&&name){
      silosReg[name]=reg;
      makeSiloFill(reg,frac);
      reg.label=label(name,active?'#e8b464':C.text,42);
      reg.label.position.y=ph+h+8;g.add(reg.label);
    }else{
      // Slot index label so empty ring pads stay readable
      reg.label=label(name||'pad',C.muted,36);
      reg.label.position.y=ph+5;g.add(reg.label);
    }
    scene.add(g);return g;
  }

  var elev=new THREE.Group();elev.position.set(0,0,-20);
  var tower=ebox(16,92,16,C.wire,0.9);tower.position.y=46;elev.add(tower);
  var head=ebox(24,14,20,C.wire,0.9);head.position.y=99;elev.add(head);
  // Outer apron ring — pads sit on this radius
  elev.add(loop(58,0.15,C.dim,0.35));
  elev.add(loop(72,0.15,C.dim,0.25));
  tag(elev,'elevator','crew rotation',124);
  scene.add(elev);

  // 12 pads around the elevator (outer ring). First 4 are live silos; rest empty.
  var PAD_N=12,PAD_R=65;
  var siloNames=['sahil','hello','jk','gmail'];
  var siloFrac=[0.12,0.001,0.57,0.67];
  var siloActive=[true,false,false,false];
  var sahil=null;
  var padSlots=[];
  for(var pi=0;pi<PAD_N;pi++){
    var ang=-Math.PI/2+pi/PAD_N*Math.PI*2;
    var px=Math.cos(ang)*PAD_R;
    var pz=-20+Math.sin(ang)*PAD_R;
    var occupied=pi<siloNames.length;
    var nm=occupied?siloNames[pi]:String(pi+1);
    var sg=siloPad(px,pz,occupied?siloFrac[pi]:0,occupied&&siloActive[pi],nm,!occupied);
    padSlots.push({x:px,z:pz,name:nm,empty:!occupied,g:sg});
    if(siloActive[pi])sahil=sg;
    // Low apron spoke under every pad — no vertical lollipop lights
    scene.add(seg([[0,1.2,-20],[px*0.88,1.2,-20+(pz+20)*0.88]],C.dim,occupied?0.3:0.18));
  }

  var AW1=['rotation','quota','handoff','harvest','silo','session','memory','gateway','relay','worktree','kit','skills','paddock','reserve','context','warmup','fable','elevator','rota','crew'];
  var AW2=['policy','notes','protocol','guide','setup','log','spec','playbook','overview','checklist','faq','runbook','map','history','audit','recipe','primer','digest'];
  function makeArticle(fieldName){
    var t=AW1[Math.floor(Math.random()*AW1.length)]+'-'+AW2[Math.floor(Math.random()*AW2.length)];
    return {title:t+'.md',path:'wiki/'+fieldName.replace(/ /g,'-')+'/'+t+'.md',url:null};
  }

  var fields=[];
  function getField(name){
    for(var i=0;i<fields.length;i++)if(fields[i].opts.name===name)return fields[i];
    return null;
  }
  function healthOf(f){
    var ok=0;
    for(var i=0;i<f.stalks.length;i++)if(f.stalks[i].state==='ok')ok++;
    return f.stalks.length?ok/f.stalks.length:1;
  }
  function rebuildField(f){
    while(f.cropG.children.length){
      var ch=f.cropG.children[f.cropG.children.length-1];
      f.cropG.remove(ch);
      if(ch.geometry)ch.geometry.dispose();
      if(ch.material)ch.material.dispose();
    }
    var healthy=[],wilted=[],dead=[],hm=[],wm=[],dm=[];
    for(var i=0;i<f.stalks.length;i++){
      var s=f.stalks[i];
      if(s.state==='ok'){
        healthy.push([s.cx,0.3,s.cz],[s.cx,0.3+s.h,s.cz]);
        hm.push(s);
      }else if(s.state==='wilt'){
        var dx=Math.cos(s.da)*2.2,dz=Math.sin(s.da)*2.2;
        wilted.push([s.cx,0.3,s.cz],[s.cx,0.3+s.h1,s.cz],
                    [s.cx,0.3+s.h1,s.cz],[s.cx+dx,Math.max(0.3+s.h1-1.4,0.4),s.cz+dz]);
        wm.push(s,s);
      }else{
        dead.push([s.cx,0.4,s.cz],[s.cx+Math.cos(s.da)*3,0.4,s.cz+Math.sin(s.da)*3]);
        dm.push(s);
      }
    }
    if(healthy.length){var hs=seg(healthy,C.green,0.55);hs.userData={map:hm,field:f};f.cropG.add(hs);}
    if(wilted.length){var ws=seg(wilted,0xc9895a,0.55);ws.userData={map:wm,field:f};f.cropG.add(ws);}
    if(dead.length){var ds=seg(dead,0x7d4a35,0.45);ds.userData={map:dm,field:f};f.cropG.add(ds);}
  }
  function updateFieldLabel(f){
    if(f.statusSprite){
      f.g.remove(f.statusSprite);
      if(f.statusSprite.material){
        if(f.statusSprite.material.map)f.statusSprite.material.map.dispose();
        f.statusSprite.material.dispose();
      }
    }
    var h=healthOf(f),statusText,statusColor;
    if(h>=0.85){statusText='healthy';statusColor='#8fae6c';}
    else if(h>=0.6){statusText='needs tending';statusColor='#e8b464';}
    else{statusText='degrading';statusColor='#d87a55';}
    f.statusSprite=label(f.opts.count+' articles · '+statusText,statusColor,68);
    f.statusSprite.position.y=13;
    f.g.add(f.statusSprite);
  }
  function field(x,z,w,d,opts){
    var g=new THREE.Group();g.position.set(x,0,z);
    g.add(seg([[-w/2,0.3,-d/2],[w/2,0.3,-d/2],[w/2,0.3,-d/2],[w/2,0.3,d/2],
               [w/2,0.3,d/2],[-w/2,0.3,d/2],[-w/2,0.3,d/2],[-w/2,0.3,-d/2]],C.wire,0.6));
    var rows=[];
    for(var i=1;i<5;i++){var zz=-d/2+d*i/5;rows.push([-w/2+3,0.3,zz],[w/2-3,0.3,zz]);}
    g.add(seg(rows,C.dim,0.35));
    var cropG=new THREE.Group();g.add(cropG);
    var stalks=[];
    for(var j=0;j<opts.density;j++){
      stalks.push({
        cx:-w/2+4+Math.random()*(w-8),
        cz:-d/2+3+Math.random()*(d-6),
        h:1.5+Math.random()*5*opts.maturity,

  function tendField(name){
    if(tr.state!=='idle')return;
    var f=null;
    if(name)f=getField(name);
    if(!f){
      var worst=0.999;
      for(var i=0;i<fields.length;i++){
        var h=healthOf(fields[i]);
        if(h<worst){worst=h;f=fields[i];}
      }
    }
    if(!f)return;
    tr.queue=[];
    for(var j=0;j<f.stalks.length;j++)if(f.stalks[j].state!=='ok')tr.queue.push(f.stalks[j]);
    tr.queue.sort(function(a,b){return (a.cz-b.cz)||(a.cx-b.cx);});
    if(!tr.queue.length)return;
    tr.f=f;tr.state='toField';tr.timer=0;
    tr.target.set(f.x+tr.queue[0].cx,0,f.z+tr.queue[0].cz);
    trBeacon.material.color.setHex(0xe8b464);
  }
  function driveToward(dt,speed){
    var dx=tr.target.x-tractor.position.x,dz=tr.target.z-tractor.position.z;
    var dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<1.5)return true;
    var step=Math.min(speed*dt,dist);
    tractor.position.x+=dx/dist*step;
    tractor.position.z+=dz/dist*step;
    tractor.rotation.y=Math.atan2(-dz,dx);
    for(var i=0;i<wheels.length;i++)wheels[i].rotation.z-=step*0.4;
    return false;
  }
  function updateTractor(dt){
    if(tr.state==='idle')return;
    if(tr.state==='deliver'){
      if(driveToward(dt,tr.speed)){tr.state='return';tr.target.copy(trHome);}
    }else if(tr.state==='toField'){
      if(driveToward(dt,tr.speed))tr.state='tending';
    }else if(tr.state==='tending'){
      driveToward(dt,15);
      tr.timer+=dt;
      while(tr.timer>0.14&&tr.queue.length){
        tr.timer-=0.14;
        var s=tr.queue.shift();
        s.state='ok';
        rebuildField(tr.f);
        updateFieldLabel(tr.f);
        if(tr.queue.length)tr.target.set(tr.f.x+tr.queue[0].cx,0,tr.f.z+tr.queue[0].cz);
      }
      if(!tr.queue.length){
        tr.state='return';
        tr.target.copy(trHome);
      }
    }else if(tr.state==='return'){
      if(driveToward(dt,tr.speed)){
        tr.state='idle';
        tractor.rotation.y=0;
        trBeacon.material.color.setHex(0x6b5330);
      }
    }
  }

  function updateLife(t,dt){
    session.p=(session.p+dt*0.004)%1;
    if(sessSlider&&document.activeElement!==sessSlider)sessSlider.value=Math.round(session.p*100);
    var a=Math.PI*(1-session.p);
    sun.position.set(Math.cos(a)*300,Math.sin(a)*170+4,-90);
    sun.rotation.z=t*0.15;
    sunBall.material.color.setHex(session.p>0.82?0xd85a30:0xe8b464);
    sunRays.material.opacity=0.25+0.3*Math.sin(a);

    for(var mm=0;mm<memMats.length;mm++){
      var me=memMats[mm];
      me.m.opacity=me.base*(0.35+0.65*(0.5+0.5*Math.sin(t*0.7+me.ph)));
    }

    activity=0.35+(activity-0.35)*Math.exp(-dt*0.5);
    if(Math.random()<activity*dt*6)spawnSmoke();
    for(var i=smoke.length-1;i>=0;i--){
      var s=smoke[i],ud=s.userData;
      ud.life-=dt;
      s.position.y+=ud.vy*dt;s.position.x+=ud.vx*dt;s.position.z+=ud.vz*dt;
      s.scale.multiplyScalar(1+dt*0.6);
      s.material.opacity=0.4*Math.max(ud.life/3,0);
      if(ud.life<=0){scene.remove(s);smoke.splice(i,1);}
    }

    for(var j=bursts.length-1;j>=0;j--){
      var b=bursts[j];b.userData.u+=b.userData.speed*dt;
      var u=b.userData.u;
      if(u>=1){scene.remove(b);bursts.splice(j,1);continue;}
      if(u>=0){b.visible=true;var p=rotaC.getPointAt(u);b.position.set(p.x,2,p.z);}
    }

    for(var k=0;k<sheep.length;k++){
      var sh=sheep[k];
      var dx=sh.tx-sh.g.position.x,dz=sh.tz-sh.g.position.z;
      var dist=Math.sqrt(dx*dx+dz*dz);
      if(dist<1.5){sh.pause-=dt;if(sh.pause<=0)newTarget(sh);}
      else{
        sh.g.position.x+=dx/dist*sh.speed*dt;
        sh.g.position.z+=dz/dist*sh.speed*dt;
        sh.g.rotation.y=Math.atan2(-dz,dx);
      }
    }

    for(var c=crows.length-1;c>=0;c--){
      var cr=crows[c];cr.t+=dt;
      if(cr.state==='land'){
        var k2=Math.min(cr.t/1.4,1);
        var sx=cr.x-24;
        cr.g.position.set(sx+(cr.x-sx)*k2,44+(6.1-44)*k2+Math.sin(k2*Math.PI)*10,138+(180-138)*k2);
        if(k2>=1)cr.state='sit';
      }else if(cr.state==='sit'){
        cr.g.position.y=6.1+Math.sin(t*3+cr.x)*0.08;
      }else if(cr.state==='flee'){
        cr.g.position.x+=cr.vx*dt;cr.g.position.y+=cr.vy*dt;cr.g.position.z+=cr.vz*dt;
        for(var mi=0;mi<cr.mats.length;mi++)cr.mats[mi].opacity=Math.max(1-cr.t*0.8,0);
        if(cr.t>1.6){scene.remove(cr.g);crows.splice(c,1);updateStat();}
      }
    }

    var bk=t-bellT;
    if(bk>=0&&bk<3){
      bellPivot.rotation.z=Math.sin(bk*14)*0.55*Math.exp(-bk*1.4);
      if(Math.floor(bk*2)!==Math.floor((bk-dt)*2)){
        addRipple(-10,130,0xe8b464);
      }
    }else{
      bellPivot.rotation.z*=0.9;
    }
    for(var r=ripples.length-1;r>=0;r--){
      var rp=ripples[r];rp.userData.t+=dt;
      var rs=1+rp.userData.t*14;rp.scale.set(rs,rs,1);
      rp.material.opacity=0.6*Math.max(1-rp.userData.t/1.6,0);
      if(rp.userData.t>1.6){scene.remove(rp);ripples.splice(r,1);}
    }
  }

  function track(pts,color,op){
    var v3=[];
    for(var i=0;i<pts.length;i++){v3.push(new THREE.Vector3(pts[i][0],1.5,pts[i][1]));}
    var curve=new THREE.CatmullRomCurve3(v3);
    var g=new THREE.BufferGeometry().setFromPoints(curve.getPoints(70));
    var l=new THREE.Line(g,new THREE.LineDashedMaterial({color:color,dashSize:4,gapSize:4,transparent:true,opacity:op}));
    l.computeLineDistances();
    scene.add(l);
    lastTrackLine=l;
    return curve;
  }

    camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize);
  resize();

  var wbtns=document.querySelectorAll('#ctl button[data-w]');
  for(var wb=0;wb<wbtns.length;wb++){
    wbtns[wb].addEventListener('click',function(){
      for(var k=0;k<wbtns.length;k++)wbtns[k].classList.remove('on');
      this.classList.add('on');
      postU.uThick.value=parseFloat(this.getAttribute('data-w'));
    });
  }
  document.getElementById('cscan').addEventListener('change',function(){
    postU.uScan.value=this.checked?1:0;
  });
  document.getElementById('ccrt').addEventListener('change',function(){
    postU.uWarp.value=this.checked?1:0;
  });

  sessSlider=document.getElementById('sess');
  sessSlider.addEventListener('input',function(){session.p=parseFloat(this.value)/100;});
  document.getElementById('bmsg').addEventListener('click',fireMessage);
  document.getElementById('bconv').addEventListener('click',addSheep);
  document.getElementById('bconvx').addEventListener('click',removeSheep);
  document.getElementById('bnotif').addEventListener('click',addCrow);
  document.getElementById('bscatter').addEventListener('click',scatterCrows);
  document.getElementById('bbell').addEventListener('click',function(){bellPending=true;});
  addSheep();addSheep();addCrow();
  document.getElementById('btend').addEventListener('click',function(){handleAction({type:'field.tend',arg:null});});

  window.farm={
    dispatch:function(e){
      if(!e||!e.type)return;
      if(e.type==='message')fireMessage();
      else if(e.type==='notification')addCrow();
      else if(e.type==='notifications.clear')scatterCrows();
      else if(e.type==='alert')bellPending=true;
      else if(e.type==='conversation.start')addSheep();
      else if(e.type==='conversation.end')removeSheep();
      else if(e.type==='tend')tendField(e.field);
    },
    setSession:function(p){session.p=Math.max(0,Math.min(1,p||0));},
    setField:function(name,data){
      var f=getField(name);
      if(!f||!data)return;
      if(typeof data.count==='number')f.opts.count=data.count;
      if(typeof data.health==='number'){
        var h=Math.max(0,Math.min(1,data.health));
        for(var i=0;i<f.stalks.length;i++){
          var s=f.stalks[i];
          s.state=Math.random()<h?'ok':(Math.random()<0.55?'wilt':'dead');
        }
        rebuildField(f);
      }
      updateFieldLabel(f);
    },
    tend:function(name){tendField(name);},
    onAction:null,
    action:function(a){handleAction(a,true);},
    setRota:function(name){setRota(name);},
    setWorktrees:function(arr){if(arr&&arr.length){worktreeData=arr;buildOrchard();}},
    setKits:function(arr){if(arr&&arr.length)kitData=arr;},
    setCommands:function(arr){if(arr&&arr.length)commandData=arr;},
    setExperts:function(arr){if(arr&&arr.length)expertData=arr;},
    setSilo:function(name,data){
      var d=siloData[name];
      if(!d||!data)return;
      if(typeof data.session==='number')d.session=Math.round(data.session);
      if(typeof data.fable==='number')d.fable=Math.round(data.fable);
      if(typeof data.weekly==='number'){
        d.weekly=Math.round(data.weekly);
        if(silosReg[name])makeSiloFill(silosReg[name],d.weekly/100);
      }
    },
    onArticleOpen:null,
    setArticles:function(name,articles){
      var f=getField(name);
      if(!f||!articles)return;
      f.stalks=[];
      var n=Math.min(articles.length,160);
      for(var i=0;i<n;i++){
        var a=articles[i]||{};
        var hv=(typeof a.health==='number')?a.health:1;
        var ttl=a.title||('article-'+(i+1)+'.md');
        f.stalks.push({
          cx:-f.w/2+4+Math.random()*(f.w-8),
          cz:-f.d/2+3+Math.random()*(f.d-6),
          h:1.5+Math.random()*5*f.opts.maturity,
          h1:1+Math.random()*3,
          da:Math.random()*Math.PI*2,
          state:hv>=0.66?'ok':(hv>=0.33?'wilt':'dead'),
          article:{title:ttl,path:a.path||('wiki/'+name.replace(/ /g,'-')+'/'+ttl),url:a.url||null}
        });
      }
      f.opts.count=articles.length;
      rebuildField(f);
      updateFieldLabel(f);
    },
    fields:function(){
      var out=[];
      for(var i=0;i<fields.length;i++){
        out.push({name:fields[i].opts.name,count:fields[i].opts.count,health:Math.round(healthOf(fields[i])*100)/100});
      }
      return out;
    },
    connect:function(url){
      try{
        var ws=new WebSocket(url);
        ws.onmessage=function(ev){
          try{
            var d=JSON.parse(ev.data);
            if(d.fields)for(var n in d.fields)window.farm.setField(n,d.fields[n]);
            if(typeof d.session==='number')window.farm.setSession(d.session);
            if(d.events)for(var i=0;i<d.events.length;i++)window.farm.dispatch(d.events[i]);
          }catch(e2){}
        };
        return ws;
      }catch(e){return null;}
    }
  };

  var reduceMotion=false;
  try{reduceMotion=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){}

  var t0=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  function now(){return ((typeof performance!=='undefined'&&performance.now)?performance.now():Date.now());}

  function tick(){
    requestAnimationFrame(tick);
    var t=(now()-t0)/1000;
    if(auto&&!dragging&&!reduceMotion)theta+=0.0014;
    cam();
    lamp.material.opacity=0.4+0.6*Math.abs(Math.sin(t*3));
    var dt=Math.min(t-lastT,0.1);lastT=t;
    if(bellPending){bellT=t;bellPending=false;}
    updateLife(t,dt);
    updateTractor(dt);
    if(!dragging)doHover();
    for(var i=0;i<parts.length;i++){
      var m=parts[i];
      var u=(m.userData.t+t*m.userData.speed)%1;
      var p=m.userData.curve.getPointAt(u);
      m.position.set(p.x,1.5,p.z);
      m.material.opacity=0.2+0.7*Math.sin(u*Math.PI);
    }
    postU.uTime.value=t;
    renderer.setRenderTarget(rt);
    renderer.render(scene,camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene,postCam);
  }
  tick();
}catch(err){
  fail('Init error: '+err.message+(err.stack?'\n\n'+err.stack:''));
}
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',start);
}else{
  start();
}
})();
</script>
<script>
/* Host adapter — added for the claude-farm desktop embed. When the estate
   runs inside an iframe, the parent drives it over postMessage and the
   simulator panel hides (real farm data replaces it). window.farm stays
   the only API; standalone opening in a browser is unchanged. */
(function(){
  if(window.parent===window)return;
  function ready(){
    if(!window.farm){setTimeout(ready,50);return;}
    var sim=document.getElementById('sim');
    if(sim)sim.style.display='none';
    /* Embed defaults: CRT warp + vignette + scanlines on, line weight 2 —
       driven through the page's own controls so the UI state stays in sync. */
    var ccrt=document.getElementById('ccrt');
    if(ccrt&&!ccrt.checked){ccrt.checked=true;ccrt.dispatchEvent(new Event('change'));}
    var cscan=document.getElementById('cscan');
    if(cscan&&!cscan.checked){cscan.checked=true;cscan.dispatchEvent(new Event('change'));}
    var w2=document.querySelector('#ctl button[data-w="1"]');
    if(w2)w2.click();
    /* Embed: the view-settings box collapses behind a gear in the lower
       right; it reopens above the gear so the two never overlap. */
    var ctl=document.getElementById('ctl');
    if(ctl){
      ctl.style.display='none';
      ctl.style.bottom='54px';
      ctl.style.right='18px';
      var css=document.createElement('style');
      css.textContent='#ctlgear{position:absolute;bottom:16px;right:18px;z-index:4;display:grid;place-items:center;width:28px;height:28px;color:#a7b4a0;background:rgba(16,24,19,0.85);border:1px solid #3a4a3a;border-radius:6px;cursor:pointer;padding:0;}'
        +'#ctlgear:hover{color:#e8dcc6;border-color:#4a5a4a;}'
        +'#ctlgear.on{color:#e8b464;border-color:#e8b464;}'
        /* Size-relative chrome: overlays scale with the viewport. The
           legend is decorative and collides at panel sizes — the building
           cards carry its info. */
        +'#hud{top:14px;left:18px;font-size:clamp(8px,2.2vmin,13px);}'
        +'#hud small{font-size:clamp(7px,1.9vmin,11px);}'
        +'#live{top:16px;right:18px;font-size:clamp(7px,1.9vmin,11px);}'
        +'#legend{display:none;}';
      document.head.appendChild(css);
      var gear=document.createElement('button');
      gear.id='ctlgear';
      gear.type='button';
      gear.title='view settings';
      gear.setAttribute('aria-label','view settings');
      gear.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>';
      gear.addEventListener('click',function(){
        var open=ctl.style.display!=='none';
        ctl.style.display=open?'none':'block';
        gear.classList.toggle('on',!open);
      });
      document.body.appendChild(gear);
    }
    window.farm.onAction=function(a){
      try{window.parent.postMessage({source:'farm-estate',kind:'action',action:a},'*');}catch(e){}
    };
    window.farm.onArticleOpen=function(article,field){
      try{window.parent.postMessage({source:'farm-estate',kind:'article',article:article,field:field},'*');}catch(e){}
    };
    window.addEventListener('message',function(ev){
      var d=ev.data;
      if(!d||d.source!=='farm-estate-host'||!Array.isArray(d.calls))return;
      for(var i=0;i<d.calls.length;i++){
        var c=d.calls[i];
        try{
          if(c&&typeof window.farm[c.fn]==='function')window.farm[c.fn].apply(null,c.args||[]);
        }catch(e){}
      }
    });
    try{window.parent.postMessage({source:'farm-estate',kind:'ready'},'*');}catch(e){}
  }
  ready();
})();
</script>
