<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' http://127.0.0.1:4545 http://127.0.0.1:7417 ws://127.0.0.1:7417; font-src 'self' data:" />
    <title>Usage Farm</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0c0a; }
      #boot { min-height: 100vh; display: grid; place-items: center; color: #f2eee8; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
      #boot-inner { display: grid; justify-items: center; gap: 14px; opacity: .9; }
      #boot img { width: 42px; height: 42px; object-fit: contain; }
      #boot-dot { width: 5px; height: 5px; border-radius: 50%; background: #d8b36a; animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
    </style>
    <script type="module" crossorigin src="/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app.css">
  </head>
  <body>
    <div id="boot" aria-live="polite"><div id="boot-inner"><img src="/brand/icon_white.png" alt="" /><div>Loading workspace…</div><div id="boot-dot"></div></div></div>
    <div id="root"></div>
  </body>
</html>
