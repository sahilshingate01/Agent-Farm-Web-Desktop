<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">usage-farm architecture</title>
  <desc id="desc">Host Mac runs the farm CLI. Per-account Linux VMs mount private provider homes and a shared work directory. farm setup equips skills and MCP into each account home.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a3a"/>
      <stop offset="100%" stop-color="#15202b"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="100%" stop-color="#1a2838"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#14b8a6"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="720" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200 M0 560 H1200 M0 640 H1200"/>
    <path d="M80 0 V720 M160 0 V720 M240 0 V720 M320 0 V720 M400 0 V720 M480 0 V720 M560 0 V720 M640 0 V720 M720 0 V720 M800 0 V720 M880 0 V720 M960 0 V720 M1040 0 V720 M1120 0 V720"/>
  </g>

  <!-- title -->
  <text x="48" y="48" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700">usage-farm</text>
  <text x="48" y="76" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">N isolated AI accounts · Apple container VMs · per-account skills &amp; MCP</text>

  <!-- HOST panel -->
  <g filter="url(#soft)">
    <rect x="48" y="110" width="320" height="520" rx="16" fill="url(#cardA)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="48" y="110" width="320" height="48" rx="16" fill="#0b1220"/>
  <rect x="48" y="142" width="320" height="16" fill="#0b1220"/>
  <text x="68" y="140" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.08em">HOST  ·  macOS</text>

  <text x="68" y="190" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">farm  (CLI)</text>
  <text x="68" y="212" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">build · new · login · setup · equip</text>

  <!-- host boxes -->
  <rect x="68" y="240" width="280" height="72" rx="10" fill="#0f172a" stroke="#475569"/>
  <text x="84" y="268" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">REPO</text>
  <text x="84" y="290" fill="#f1f5f9" font-family="ui-monospace, Menlo, monospace" font-size="12">~/…/usage-farm</text>

  <rect x="68" y="328" width="280" height="88" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="84" y="356" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">STATE  (never in git)</text>
  <text x="84" y="378" fill="#f1f5f9" font-family="ui-monospace, Menlo, monospace" font-size="12">~/.usage-farm/</text>
  <text x="84" y="398" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11">accounts/ · work/</text>

  <rect x="68" y="432" width="280" height="72" rx="10" fill="#0f172a" stroke="#475569"/>
  <text x="84" y="460" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">OPTIONAL SOURCE</text>
  <text x="84" y="482" fill="#f1f5f9" font-family="ui-monospace, Menlo, monospace" font-size="12">~/.claude  (skills · agents)</text>

  <rect x="68" y="520" width="280" height="84" rx="10" fill="#0f172a" stroke="#14b8a6" stroke-opacity="0.55"/>
  <text x="84" y="548" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">farm setup / equip</text>
  <text x="84" y="570" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Vercel skills CLI → CLAUDE_CONFIG_DIR</text>
  <text x="84" y="590" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">copy host picks · merge MCP catalog</text>

  <!-- CONNECTOR: host to VMs -->
  <path d="M368 300 H420" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M368 370 H420" stroke="#14b8a6" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="378" y="288" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">auth</text>
  <text x="372" y="392" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">mounts</text>

  <!-- VM cluster panel -->
  <g filter="url(#soft)">
    <rect x="420" y="110" width="732" height="360" rx="16" fill="url(#cardB)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="420" y="110" width="732" height="48" rx="16" fill="#0b1220"/>
  <rect x="420" y="142" width="732" height="16" fill="#0b1220"/>
  <text x="440" y="140" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.08em">APPLE CONTAINER VMs  ·  Linux  ·  no Keychain</text>

  <!-- VM cards -->
  <!-- hello -->
  <rect x="444" y="180" width="210" height="250" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="444" y="180" width="210" height="40" rx="12" fill="#1c1917"/>
  <rect x="444" y="204" width="210" height="16" fill="#1c1917"/>
  <circle cx="464" cy="200" r="5" fill="#22c55e"/>
  <text x="478" y="205" fill="#f8fafc" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">hello</text>
  <text x="460" y="240" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">/root/.claude ←</text>
  <text x="460" y="258" fill="#fbbf24" font-family="ui-monospace, Menlo, monospace" font-size="10">accounts/hello/</text>
  <text x="460" y="274" fill="#fbbf24" font-family="ui-monospace, Menlo, monospace" font-size="10">claude-home</text>
  <text x="460" y="310" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">private OAuth</text>
  <text x="460" y="328" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">skills · agents</text>
  <text x="460" y="346" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">.mcp.json</text>
  <text x="460" y="380" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">worktree: wt-…-hello</text>
  <text x="460" y="404" fill="#475569" font-family="ui-monospace, Menlo, monospace" font-size="10">usage-hello</text>

  <!-- sahil -->
  <rect x="680" y="180" width="210" height="250" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="680" y="180" width="210" height="40" rx="12" fill="#0c1929"/>
  <rect x="680" y="204" width="210" height="16" fill="#0c1929"/>
  <circle cx="700" cy="200" r="5" fill="#22c55e"/>
  <text x="714" y="205" fill="#f8fafc" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">sahil</text>
  <text x="696" y="240" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">/root/.claude ←</text>
  <text x="696" y="258" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="10">accounts/sahil/</text>
  <text x="696" y="274" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="10">claude-home</text>
  <text x="696" y="310" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">private OAuth</text>
  <text x="696" y="328" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">skills · agents</text>
  <text x="696" y="346" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">.mcp.json</text>
  <text x="696" y="380" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">worktree: wt-…-sahil</text>
  <text x="696" y="404" fill="#475569" font-family="ui-monospace, Menlo, monospace" font-size="10">usage-sahil</text>

  <!-- gmail / N -->
  <rect x="916" y="180" width="210" height="250" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="916" y="180" width="210" height="40" rx="12" fill="#1a1030"/>
  <rect x="916" y="204" width="210" height="16" fill="#1a1030"/>
  <circle cx="936" cy="200" r="5" fill="#22c55e"/>
  <text x="950" y="205" fill="#f8fafc" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">acct N …</text>
  <text x="932" y="240" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">/root/.claude ←</text>
  <text x="932" y="258" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="10">accounts/&lt;name&gt;/</text>
  <text x="932" y="274" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="10">claude-home</text>
  <text x="932" y="310" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">private OAuth</text>
  <text x="932" y="328" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">own profile kit</text>
  <text x="932" y="346" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">scale to RAM</text>
  <text x="932" y="380" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">worktree: wt-…-N</text>
  <text x="932" y="404" fill="#475569" font-family="ui-monospace, Menlo, monospace" font-size="10">farm run claude &lt;acct&gt;</text>

  <!-- SHARED WORK panel -->
  <g filter="url(#soft)">
    <rect x="420" y="492" width="732" height="138" rx="16" fill="url(#cardA)" stroke="#14b8a6" stroke-width="1.5"/>
  </g>
  <text x="444" y="528" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em">SHARED WORKSPACE  ·  same absolute path host ↔ every VM</text>
  <text x="444" y="556" fill="#f1f5f9" font-family="ui-monospace, Menlo, monospace" font-size="13">~/.usage-farm/work</text>
  <text x="444" y="582" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">bare repos · per-account git worktrees · git paths resolve everywhere</text>
  <text x="444" y="608" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">farm clone · farm wt &lt;repo&gt; &lt;acct&gt; · farm run claude &lt;acct&gt; wt-repo-acct</text>

  <!-- arrows from VMs down to shared work -->
  <path d="M549 430 V492" stroke="#14b8a6" stroke-width="1.5" fill="none" marker-end="url(#arrowTeal)" opacity="0.8"/>
  <path d="M785 430 V492" stroke="#14b8a6" stroke-width="1.5" fill="none" marker-end="url(#arrowTeal)" opacity="0.8"/>
  <path d="M1021 430 V492" stroke="#14b8a6" stroke-width="1.5" fill="none" marker-end="url(#arrowTeal)" opacity="0.8"/>

  <!-- footer legend -->
  <circle cx="60" cy="666" r="5" fill="#f59e0b"/>
  <text x="72" y="670" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">per-account credentials &amp; kit (isolated)</text>
  <circle cx="360" cy="666" r="5" fill="#14b8a6"/>
  <text x="372" y="670" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">shared work mount</text>
  <circle cx="560" cy="666" r="5" fill="#a78bfa"/>
  <text x="572" y="670" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">scale N accounts · FARM_MEM default 4g each</text>
</svg>
